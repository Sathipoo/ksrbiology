name: 🚀 Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: focus-empire-483313-n6
  SERVICE_NAME: ksrbiology
  REGION: asia-south1
  GCS_BUCKET_NAME: pika-wil
  GCS_FOLDER_PREFIX: ksr-biology

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 🛠️ Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: 🚀 Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars="GCS_BUCKET_NAME=${{ env.GCS_BUCKET_NAME }},GCS_FOLDER_PREFIX=${{ env.GCS_FOLDER_PREFIX }},ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD || 'ksradmin2026' }},SECRET_KEY=${{ secrets.SECRET_KEY || 'ksr-biology-cloud-run-key-2026' }}"
